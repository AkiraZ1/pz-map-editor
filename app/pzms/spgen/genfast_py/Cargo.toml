[package]
name = "gfpy"
version = "0.1.0"
edition = "2021"

[lib]
name = "_gfpy"
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
pyo3 = { version = "0.27", features = ["extension-module", "abi3-py39", "generate-import-lib"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
